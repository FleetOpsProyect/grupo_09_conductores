services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ms-conductores:local
    container_name: conductores_backend
    env_file:
      - .env
    environment:
      FIREBASE_EMULATOR_HOST: firestore-emulator:8080
    ports:
      - "${SERVER_PORT:-8085}:${SERVER_PORT:-8085}"
    depends_on:
      firestore-emulator:
        condition: service_healthy

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:590.0.1-emulators
    container_name: conductores_firestore
    command: ["gcloud", "beta", "emulators", "firestore", "start", "--host-port=0.0.0.0:8080"]
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
