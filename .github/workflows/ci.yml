name: CI — Integración Continua

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    name: Build, Test y Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@99b8673ff6ca2fb9991403c461e712a32230eb49 # v4.2.2
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache de dependencias Gradle
        uses: actions/cache@1bc1140533bdc621d8b9e5863ca6884022a1215b # v4.1.2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Dar permisos al Gradle wrapper
        run: chmod +x gradlew

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Tests unitarios
        run: ./gradlew test --tests "co.edu.univalle.conductores.domain.*" --tests "co.edu.univalle.conductores.application.service.*"

      - name: Tests de integración con Testcontainers
        run: ./gradlew test --tests "co.edu.univalle.conductores.adapter.*" --tests "co.edu.univalle.conductores.actuator.*" --tests "co.edu.univalle.conductores.openapi.*"

      - name: Generar reporte JaCoCo
        run: ./gradlew jacocoTestReport

      - name: Verificar cobertura >= 80%
        run: ./gradlew jacocoTestCoverageVerification

      - name: Build final
        run: ./gradlew bootJar -x test

      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: jacoco-report
          path: build/jacocoHtml/
          retention-days: 7

      - name: Qodo — revisión automática del PR
        uses: Codium-ai/pr-agent@afe037e9760bd99cbda7ed5b3454cb94d5e08ca7 # main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr_url: ${{ github.event.pull_request.html_url }}

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout del código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@99b8673ff6ca2fb9991403c461e712a32230eb49 # v4.2.2
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Gradle
        uses: actions/cache@1bc1140533bdc621d8b9e5863ca6884022a1215b # v4.1.2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Dar permisos al Gradle wrapper
        run: chmod +x gradlew

      - name: Generar reporte JaCoCo para SonarCloud
        run: ./gradlew test jacocoTestReport -x checkstyleMain -x checkstyleTest

      - name: Análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon
