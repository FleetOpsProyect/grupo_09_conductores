name: CD — Despliegue continuo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew clean build jacocoTestReport sonar

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ms-conductores:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/ms-conductores:latest', secrets.DOCKERHUB_USERNAME) || '' }}

  
  deploy:
    name: Deploy backend and observability to EC2
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare remote deployment staging directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -eu
            mkdir -p "$HOME/app/.deploy-staging-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Sync production Compose and observability configuration
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: docker-compose.prod.yml,observability
          target: ~/app/.deploy-staging-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -eu

            APP_DIR="$HOME/app"
            STAGING_DIR="$APP_DIR/.deploy-staging-${{ github.run_id }}-${{ github.run_attempt }}"
            trap 'rm -rf -- "$STAGING_DIR"' EXIT

            test -f "$APP_DIR/.env"
            SERVER_PORT=$(grep '^SERVER_PORT=' "$APP_DIR/.env" | cut -d= -f2 || true)
            if [ "$SERVER_PORT" != "8085" ]; then
              echo "SERVER_PORT in the EC2 .env must be 8085 for the backend healthcheck and Prometheus scrape target."
              exit 1
            fi
            if [ ! -s "$APP_DIR/secrets/grafana_admin_password" ]; then
              echo "Missing persistent Grafana secret file: $APP_DIR/secrets/grafana_admin_password"
              echo "Migrate the existing Grafana password to that file before enabling automated deployment."
              exit 1
            fi
            SECRET_MODE=$(stat -c '%a' "$APP_DIR/secrets/grafana_admin_password")
            if [ "$SECRET_MODE" != "600" ]; then
              echo "Grafana secret file must have mode 600; fix its permissions before deployment."
              exit 1
            fi
            if grep -q '^GRAFANA_ADMIN_PASSWORD=' "$APP_DIR/.env"; then
              echo "Remove the old plaintext GRAFANA_ADMIN_PASSWORD entry from .env after migrating it to the secret file."
              exit 1
            fi

            ln -s "$APP_DIR/.env" "$STAGING_DIR/.env"
            ln -s "$APP_DIR/secrets" "$STAGING_DIR/secrets"

            echo "Validating staged Docker Compose configuration"
            if ! docker compose \
              --project-directory "$STAGING_DIR" \
              --env-file "$APP_DIR/.env" \
              -f "$STAGING_DIR/docker-compose.prod.yml" config --quiet; then
              echo "Staged Compose validation failed; production files and containers were not changed."
              exit 1
            fi

            install -m 0644 "$STAGING_DIR/docker-compose.prod.yml" "$APP_DIR/docker-compose.prod.yml"
            mkdir -p "$APP_DIR/observability"
            cp -a "$STAGING_DIR/observability/." "$APP_DIR/observability/"

            echo "Validating synchronized Docker Compose configuration"
            docker compose -f "$APP_DIR/docker-compose.prod.yml" config --quiet

            IMAGE_TAG="${{ github.sha }}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ms-conductores:$IMAGE_TAG"

            PREVIOUS_TAG=$(grep '^IMAGE_TAG=' "$APP_DIR/.env" | cut -d= -f2 || true)
            BACKEND_OK=0
            BACKEND_UPDATE_ATTEMPTED=0
            OBSERVABILITY_OK=1

            echo "Deploying image $IMAGE (previous tag: ${PREVIOUS_TAG:-none})"
            if docker pull "$IMAGE"; then
              echo "Updating backend image version"
              if grep -q '^IMAGE_TAG=' "$APP_DIR/.env"; then
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" "$APP_DIR/.env"
              else
                echo "IMAGE_TAG=$IMAGE_TAG" >> "$APP_DIR/.env"
              fi

              BACKEND_UPDATE_ATTEMPTED=1
              if docker compose -f "$APP_DIR/docker-compose.prod.yml" up -d --no-deps backend; then
                echo "Checking application health"
                for i in $(seq 1 18); do
                  if curl -fsS http://localhost:8085/health > /dev/null; then
                    echo "Backend deployment successful ($IMAGE_TAG)"
                    BACKEND_OK=1
                    break
                  fi
                  sleep 5
                done
              else
                echo "Backend container update failed"
              fi
            else
              echo "Unable to pull backend image $IMAGE"
            fi

            if [ "$BACKEND_OK" -ne 1 ]; then
              echo "Backend did not become healthy"
              docker compose -f "$APP_DIR/docker-compose.prod.yml" ps
              if [ "$BACKEND_UPDATE_ATTEMPTED" -eq 1 ] && [ -n "$PREVIOUS_TAG" ]; then
                echo "Rolling back backend to $PREVIOUS_TAG"
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" "$APP_DIR/.env"
                if ! docker compose -f "$APP_DIR/docker-compose.prod.yml" up -d --no-deps backend; then
                  echo "Backend rollback command failed"
                fi
              elif [ "$BACKEND_UPDATE_ATTEMPTED" -eq 1 ]; then
                echo "No previous tag to roll back to"
              else
                echo "Backend update was not attempted; leaving the running backend unchanged"
              fi
            fi

            echo "Updating observability services independently from the backend"
            for service in node-exporter prometheus grafana; do
              if docker compose -f "$APP_DIR/docker-compose.prod.yml" up -d --no-deps "$service"; then
                echo "Requested update for $service"
              else
                echo "Failed to update $service"
                OBSERVABILITY_OK=0
              fi
            done

            query_target_up() {
              target_job="$1"
              target_instance="$2"
              result=$(docker compose -f "$APP_DIR/docker-compose.prod.yml" exec -T prometheus \
                promtool query instant http://localhost:9090 "up{job=\"$target_job\"}" 2>&1) || return 1
              printf '%s\n' "$result" \
                | grep -F "instance=\"$target_instance\"" \
                | grep -Fq '=> 1'
            }

            query_node_memory() {
              result=$(docker compose -f "$APP_DIR/docker-compose.prod.yml" exec -T prometheus \
                promtool query instant http://localhost:9090 \
                'node_memory_MemTotal_bytes{job="node-exporter"}' 2>&1) || return 1
              printf '%s\n' "$result" | grep -Eq '=> [0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?'
            }

            query_node_cpu() {
              result=$(docker compose -f "$APP_DIR/docker-compose.prod.yml" exec -T prometheus \
                promtool query instant http://localhost:9090 \
                'node_cpu_seconds_total{job="node-exporter", mode="idle"}' 2>&1) || return 1
              printf '%s\n' "$result" | grep -Eq '=> [0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?'
            }

            echo "Checking Prometheus targets and node_exporter CPU/memory metrics"
            TARGETS_OK=0
            for i in $(seq 1 18); do
              if query_target_up "ms-conductores" "backend:8085" \
                && query_target_up "node-exporter" "node-exporter:9100" \
                && query_node_memory \
                && query_node_cpu; then
                TARGETS_OK=1
                break
              fi
              sleep 5
            done

            if [ "$TARGETS_OK" -eq 1 ]; then
              echo "Prometheus targets are UP; node_exporter CPU and memory metrics are present"
            else
              echo "Prometheus targets or node_exporter CPU/memory metrics did not become available"
              OBSERVABILITY_OK=0
              docker compose -f "$APP_DIR/docker-compose.prod.yml" ps
            fi

            if [ "$BACKEND_OK" -ne 1 ]; then
              echo "Backend deployment failed; rollback was attempted. Observability was deployed and checked independently."
              exit 1
            fi
            if [ "$OBSERVABILITY_OK" -ne 1 ]; then
              echo "Observability deployment or checks failed; backend remains on its healthy deployed version."
              exit 1
            fi

            echo "Backend and observability deployment checks succeeded ($IMAGE_TAG)"
