name: CD — Despliegue continuo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build and test
        run: ./gradlew clean build jacocoTestReport

      - name: SonarCloud analysis
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ms-conductores:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/ms-conductores:latest', secrets.DOCKERHUB_USERNAME) || '' }}

  
  deploy:
    name: Deploy backend and exporters to EC2
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare remote deployment staging directory
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -eu
            mkdir -p "$HOME/app/.deploy-staging-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Sync production Compose configuration
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: docker-compose.prod.yml
          target: ~/app/.deploy-staging-${{ github.run_id }}-${{ github.run_attempt }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -eu

            APP_DIR="$HOME/app"
            STAGING_DIR="$APP_DIR/.deploy-staging-${{ github.run_id }}-${{ github.run_attempt }}"
            COMPOSE="docker compose -f $APP_DIR/docker-compose.prod.yml"
            trap 'rm -rf -- "$STAGING_DIR"' EXIT

            test -f "$APP_DIR/.env"
            SERVER_PORT=$(grep '^SERVER_PORT=' "$APP_DIR/.env" | cut -d= -f2 || true)
            if [ "$SERVER_PORT" != "8085" ]; then
              echo "SERVER_PORT in the EC2 .env must be 8085: docker-compose.prod.yml publishes the API on 8085."
              exit 1
            fi
            MANAGEMENT_PORT=$(grep '^MANAGEMENT_PORT=' "$APP_DIR/.env" | cut -d= -f2 || true)
            if [ -n "$MANAGEMENT_PORT" ] && [ "$MANAGEMENT_PORT" != "18001" ]; then
              echo "MANAGEMENT_PORT in the EC2 .env must be 18001 or unset: docker-compose.prod.yml publishes 18001."
              exit 1
            fi

            ln -s "$APP_DIR/.env" "$STAGING_DIR/.env"

            echo "Validating staged Docker Compose configuration"
            if ! docker compose \
              --project-directory "$STAGING_DIR" \
              --env-file "$APP_DIR/.env" \
              -f "$STAGING_DIR/docker-compose.prod.yml" config --quiet; then
              echo "Staged Compose validation failed; production files and containers were not changed."
              exit 1
            fi

            install -m 0644 "$STAGING_DIR/docker-compose.prod.yml" "$APP_DIR/docker-compose.prod.yml"
            $COMPOSE config --quiet

            IMAGE_TAG="${{ github.sha }}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ms-conductores:$IMAGE_TAG"

            PREVIOUS_TAG=$(grep '^IMAGE_TAG=' "$APP_DIR/.env" | cut -d= -f2 || true)
            BACKEND_OK=0
            BACKEND_UPDATE_ATTEMPTED=0
            EXPORTERS_OK=1

            echo "Deploying image $IMAGE (previous tag: ${PREVIOUS_TAG:-none})"
            if docker pull "$IMAGE"; then
              echo "Updating backend image version"
              if grep -q '^IMAGE_TAG=' "$APP_DIR/.env"; then
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" "$APP_DIR/.env"
              else
                echo "IMAGE_TAG=$IMAGE_TAG" >> "$APP_DIR/.env"
              fi

              BACKEND_UPDATE_ATTEMPTED=1
              if $COMPOSE up -d --no-deps backend; then
                echo "Checking application health on the management port"
                for i in $(seq 1 18); do
                  if curl -fsS http://localhost:18001/health > /dev/null; then
                    echo "Backend deployment successful ($IMAGE_TAG)"
                    BACKEND_OK=1
                    break
                  fi
                  sleep 5
                done
              else
                echo "Backend container update failed"
              fi
            else
              echo "Unable to pull backend image $IMAGE"
            fi

            if [ "$BACKEND_OK" -ne 1 ]; then
              echo "Backend did not become healthy"
              $COMPOSE ps
              if [ "$BACKEND_UPDATE_ATTEMPTED" -eq 1 ] && [ -n "$PREVIOUS_TAG" ]; then
                echo "Rolling back backend to $PREVIOUS_TAG"
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" "$APP_DIR/.env"
                if ! $COMPOSE up -d --no-deps backend; then
                  echo "Backend rollback command failed"
                fi
              elif [ "$BACKEND_UPDATE_ATTEMPTED" -eq 1 ]; then
                echo "No previous tag to roll back to"
              else
                echo "Backend update was not attempted; leaving the running backend unchanged"
              fi
            fi

            # --remove-orphans removes the Prometheus and Grafana containers of the previous setup:
            # they now run on the local machine (observability/docker-compose.yml), not on the EC2.
            echo "Updating exporters independently from the backend"
            if ! $COMPOSE up -d --no-deps --remove-orphans node-exporter cadvisor; then
              echo "Failed to update the exporters"
              EXPORTERS_OK=0
            fi

            # check_metrics <url> <metric that must be present>
            # For 18001 it checks process_uptime_seconds, which exists from startup. The HTTP metrics
            # (http_server_requests_*) only appear after the first request to the API port (8085).
            check_metrics() {
              curl -fsS "$1" 2>/dev/null | grep -q "^$2"
            }

            echo "Checking that every exporter publishes metrics"
            METRICS_OK=0
            for i in $(seq 1 18); do
              if check_metrics http://localhost:19100/metrics node_cpu_seconds_total \
                && check_metrics http://localhost:19100/metrics node_filesystem_avail_bytes \
                && check_metrics http://localhost:18080/metrics container_cpu_usage_seconds_total \
                && { [ "$BACKEND_OK" -ne 1 ] || check_metrics http://localhost:18001/metrics process_uptime_seconds; }; then
                METRICS_OK=1
                break
              fi
              sleep 5
            done

            if [ "$METRICS_OK" -eq 1 ]; then
              echo "node_exporter (19100), cAdvisor (18080) and the service (18001) publish metrics"
            else
              echo "Some exporter did not publish metrics in time"
              EXPORTERS_OK=0
              $COMPOSE ps
            fi

            if [ "$BACKEND_OK" -ne 1 ]; then
              echo "Backend deployment failed; rollback was attempted. Exporters were deployed and checked independently."
              exit 1
            fi
            if [ "$EXPORTERS_OK" -ne 1 ]; then
              echo "Exporter deployment or checks failed; backend remains on its healthy deployed version."
              exit 1
            fi

            echo "Backend and exporter deployment checks succeeded ($IMAGE_TAG)"
