name: Docker - Build and Publish

on:
  workflow_dispatch:
  push:
    branches:
      - chore/setup-ec2-dockerhub-pipeline

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ms-conductores:${{ github.sha }}

  
  deploy:
    name: Deploy backend to EC2
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            cd /home/ec2-user/app

            IMAGE_TAG="${{ github.sha }}"
            IMAGE="zoikle/ms-conductores:$IMAGE_TAG"

            echo "Pulling image $IMAGE"
            docker pull "$IMAGE"

            echo "Updating version"
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env

            echo "Recreating backend"
            docker compose -f docker-compose.prod.yml up -d --no-deps backend

            echo "Checking application health"
            for i in $(seq 1 18); do
              if curl -fsS http://localhost:8085/health > /dev/null; then
                echo "Deployment successful"
                exit 0
              fi
              sleep 5
            done

            echo "Backend did not respond correctly"
            docker compose -f docker-compose.prod.yml ps
            exit 1

