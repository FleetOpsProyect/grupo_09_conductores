global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ms-conductores
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8085

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
