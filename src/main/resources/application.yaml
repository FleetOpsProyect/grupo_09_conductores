spring:
  profiles:
    active: dev
  application:
    name: ms-conductores

server:
  port: 8085
  servlet:
    context-path: /ms-conductores

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
