spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ms-conductores
  main:
    # Sin banner, para que la salida estándar sea solo JSON (TEC_03).
    banner-mode: off
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

server:
  port: ${SERVER_PORT}

logging:
  # Logs en JSON con el esquema ECS de Spring Boot (TEC_03), más el contexto (MDC) como campos propios:
  # correlation_id, http_method y http_path en las peticiones HTTP; event_id, event_type y correlation_id
  # en los eventos consumidos y publicados. LOG_FORMAT vacío vuelve al texto plano (solo en local).
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    json:
      # Enmascara emails y teléfonos en cualquier campo de texto del log.
      customizer: co.edu.univalle.conductores.config.logging.ContactDataMaskingCustomizer

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
    emulator-host: ${FIREBASE_EMULATOR_HOST:}
  firestore:
    timeout: ${FIRESTORE_TIMEOUT:2s}
  documentacion:
    url: ${DOCUMENTACION_URL:}
    timeout-ms: ${DOCUMENTACION_TIMEOUT_MS:2000}
  messaging:
    driver-events-topic-arn: "${FLEETOPS_DRIVER_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:fleetops_driver_events}"
    driver-queue: "${FLEETOPS_DRIVER_QUEUE_URL:fleetops_driver_queue}"
    driver-dlq-url: "${FLEETOPS_DRIVER_DLQ_URL:fleetops_driver_dlq}"
    consumer-enabled: ${FLEETOPS_CONSUMER_ENABLED:true}
  outbox:
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

management:
  # Actuator (/health, /metrics, /info) en un puerto propio, separado del de la API (dojo de monitoreo,
  # Caso B): el puerto de la API puede quedar público sin exponer las métricas.
  server:
    port: ${MANAGEMENT_PORT:18001}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 2s
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
