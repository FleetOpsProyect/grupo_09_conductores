spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ms-conductores
  jackson:
    property-naming-strategy: SNAKE_CASE
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

server:
  port: ${SERVER_PORT}

app:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
    emulator-host: ${FIREBASE_EMULATOR_HOST:}
  firestore:
    timeout: ${FIRESTORE_TIMEOUT:2s}
  messaging:
    driver-events-topic-arn: "${FLEETOPS_DRIVER_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:fleetops_driver_events}"
    driver-queue: "${FLEETOPS_DRIVER_QUEUE_URL:fleetops_driver_queue}"
    driver-dlq-url: "${FLEETOPS_DRIVER_DLQ_URL:fleetops_driver_dlq}"
    consumer-enabled: ${FLEETOPS_CONSUMER_ENABLED:true}
  outbox:
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        prometheus: metrics
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
